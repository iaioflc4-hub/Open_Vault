name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar el proyecto con la vista web
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[visor]"

      - name: Revisar sintaxis de los scripts
        run: |
          for script in install.sh configurar.sh visor/comun.sh visor/leer.sh visor/sincronizar.sh; do
            bash -n "$script" && echo "$script: ok"
          done
          command -v shellcheck >/dev/null && shellcheck -S warning install.sh configurar.sh visor/comun.sh visor/leer.sh visor/sincronizar.sh || echo "shellcheck no está disponible"

      - name: Correr las pruebas
        run: python -m unittest discover -s tests -v
